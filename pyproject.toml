[project]
name = "monday"
version = "0.1.0"
description = "MONDAY - a draft-only, human-approved multi-agent job search autopilot"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
monday = "monday.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["monday*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
